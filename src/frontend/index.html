<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Sky Pilot — Flight Simulator</title>
    <meta name="description" content="Sky Pilot is a pocket flight simulator on the Internet Computer. Fly six routes, land clean, and post your high score." />
    <meta name="theme-color" content="#0a0e1a" />
    <meta property="og:site_name" content="Sky Pilot" />
    <meta property="og:title" content="Sky Pilot — Flight Simulator" />
    <meta property="og:description" content="A pocket flight simulator. Pick a route, fly the gates, and put it down softly on the runway." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/link_preview.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1731" />
    <meta property="og:image:height" content="909" />
    <meta property="og:image:alt" content="Sky Pilot — a Cessna over a coastal runway with flight-plan rings and a cockpit HUD." />
    <meta property="og:locale" content="en_US" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Sky Pilot — Flight Simulator" />
    <meta name="twitter:description" content="A pocket flight simulator. Pick a route, fly the gates, and put it down softly on the runway." />
    <meta name="twitter:image" content="/link_preview.png" />
    <meta name="twitter:image:alt" content="Sky Pilot — a Cessna over a coastal runway with flight-plan rings and a cockpit HUD." />
    <link rel="image_src" href="/link_preview.png" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <script>
      (function () {
        var origin = window.location.origin;
        if (!origin || origin === "null") return;
        var image = origin + "/link_preview.png";
        var pairs = [
          ["property", "og:image", image],
          ["property", "og:url", origin + "/"],
          ["name", "twitter:image", image],
        ];
        for (var i = 0; i < pairs.length; i++) {
          var el = document.querySelector(
            'meta[' + pairs[i][0] + '="' + pairs[i][1] + '"]',
          );
          if (el) el.setAttribute("content", pairs[i][2]);
        }
        var link = document.querySelector('link[rel="image_src"]');
        if (link) link.setAttribute("href", image);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
